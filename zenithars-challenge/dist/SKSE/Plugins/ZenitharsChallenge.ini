; Zenithar's Challenge - settings
; To keep your changes across updates, copy the lines you change into
; ZenitharsChallenge_Custom.ini in this same folder. Values there win.
;
; The rules of the challenge are not settings. The six that are up to you are chosen in the game,
; once, when your character is asked, and they are written to your run.

[Rules]
; Ask a character that was made before the mod was installed whether it takes the challenge, after loading.
; A new character is always asked once LoreRim's own setup is over.
; A character that joins this way keeps nothing: what it carries is not its own work, starting clothes
; and food included, and its run says on which day it joined.
bAskOnLoad = 0

[Messages]
; Show a line when something is refused or a rule is broken.
bShowWarnings = 1
; Show a line each time something you made, mined, chopped, hunted, cooked or brewed is counted.
bShowMadeMessages = 1
; Show a line when gear, food, potions, ore or firewood that is not yours enters your pack.
bShowNotYoursMessages = 0
; Mark items that are not yours wherever items are listed: your inventory, your side of a merchant's
; screen, a chest, the quick-loot window, the item card, and the name under the crosshair.
bMarkInventory = 1
; Mark them with a small struck-through anvil after the name, and a dull red name.
bMarkWithIcon = 1
; Mark them with words after the name, e.g. "Iron Sword [not yours]". A stack that is only partly yours always says how many.
bMarkWithText = 0

[Debug]
; Write every pack change to the log (Documents/My Games/Skyrim Special Edition/SKSE/Zenithars Challenge.log).
bVerboseLog = 1
