; Zenithar's Challenge - settings (phase 2 test build: warnings only, nothing is blocked)
; To keep your changes across updates, copy the lines you change into
; ZenitharsChallenge_Custom.ini in this same folder. Values there win.

[Rules]
; Count hides and meat taken from animals you did not kill yourself.
bCountOthersKills = 0
; Items from these plugins may be eaten or drunk whoever made them (water, provisions).
; Separate plugin names with |
sAllowedPlugins = Waterskin.esp|LoreRim Respawn Provision.esp
; Clothing, jewelry, cloaks and bags must be made by you too, not only armor. 0 = only light and heavy armor.
bRestrictClothing = 1
; Testing aid: oath or off overrides the character's own choice. Empty uses the character's own.
; oath = on the challenge, breaking a rule is refused. off = a standard playthrough, the mod stays out of the way.
sForceMode =
; Testing aid: ask a character that has not been asked yet whether it takes the challenge, after loading.
; A new character is always asked once LoreRim's own setup is over.
bAskOnLoad = 0

[Messages]
; Show a line when a rule is broken.
bShowWarnings = 1
; Show a line each time something you made, mined, chopped, hunted, cooked or brewed is counted.
bShowMadeMessages = 1
; Show a line when gear, food, potions, ore or firewood that is not yours enters your pack.
bShowNotYoursMessages = 0
; Mark rows in your inventory, and your side of a merchant's screen, that hold items which are not yours.
bMarkInventory = 1
; Mark them with a small struck-through anvil after the name, and a dull red name.
bMarkWithIcon = 1
; Mark them with words after the name, e.g. "Iron Sword [not yours]". A stack that is only partly yours always says how many.
bMarkWithText = 0

[Debug]
; Write every pack change to the log (Documents/My Games/Skyrim Special Edition/SKSE/Zenithars Challenge.log).
bVerboseLog = 1
