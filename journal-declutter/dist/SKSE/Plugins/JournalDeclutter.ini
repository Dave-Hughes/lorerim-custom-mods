; Journal Declutter - settings
; To keep your changes across updates, copy the lines you change into
; JournalDeclutter_Custom.ini in this same folder. Values there win.
;
; Key codes are DirectInput scan codes (the numbers SkyUI MCMs show).
; Common ones: Delete = 211, Insert = 210, Home = 199, End = 207,
; Backspace = 14, F1..F10 = 59..68, F11 = 87, F12 = 88, H = 35, X = 45

[Keys]
; Hides the highlighted quest (or, on the Miscellaneous page, the highlighted objective).
; With "show hidden" on, pressing it on a hidden entry restores that entry.
iHideKey = 211

; Shows hidden entries in place, greyed-in with a prefix, so you can restore one.
; Press again to hide them.
iShowHiddenKey = 210

; Restores every hidden quest and objective for this character.
iRestoreAllKey = 211
; Require Shift together with iRestoreAllKey (always on when it shares a key with iHideKey).
bRestoreAllNeedsShift = 1

[Behavior]
; Also clear the quest's "active" flag when hiding it, so its markers leave the compass and map.
bDeactivateHiddenQuests = 1

; Play the journal's own quest-toggle sounds on hide / restore.
bPlaySounds = 1

; Text put in front of hidden entries while "show hidden" is on.
sHiddenPrefix = "[HIDDEN] "

[Debug]
; Writes every hide/show step to Documents\My Games\Skyrim Special Edition\SKSE\JournalDeclutter.log
bVerboseLog = 0
