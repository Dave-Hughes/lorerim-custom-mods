name: Journal Declutter

on:
  push:
    branches: [ main ]
    paths:
      - 'journal-declutter/**'
      - 'lib/commonlibsse-ng'
      - '.github/workflows/journal-declutter.yml'
    tags: [ 'journal-declutter-v*' ]
  pull_request:
    paths:
      - 'journal-declutter/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build DLL (MSVC, Release)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg_downloads
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_binary_cache,readwrite"
      VCPKG_FORCE_SYSTEM_BINARIES: "1"

    steps:
      - name: Checkout (with CommonLibSSE-NG submodule)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: 'journal-declutter/vcpkg.json'
          runVcpkgInstall: false

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_downloads
          key: ${{ runner.os }}-vcpkg-downloads-${{ hashFiles('journal-declutter/vcpkg.json') }}
          restore-keys: ${{ runner.os }}-vcpkg-downloads-

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_binary_cache
          key: ${{ runner.os }}-vcpkg-binpkgs-static-md-${{ hashFiles('journal-declutter/vcpkg.json') }}
          restore-keys: ${{ runner.os }}-vcpkg-binpkgs-static-md-

      - name: Install vcpkg dependencies (retry)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 40
          max_attempts: 3
          retry_wait_seconds: 30
          shell: pwsh
          command: |
            Set-Location journal-declutter
            & "$env:VCPKG_ROOT/vcpkg" install --triplet=x64-windows-static-md --host-triplet=x64-windows-static-md

      - name: Configure
        working-directory: journal-declutter
        run: cmake --preset release-msvc

      - name: Build
        working-directory: journal-declutter
        run: cmake --build --preset release-msvc

      - name: Show package
        working-directory: journal-declutter
        run: Get-ChildItem -Recurse build/release/package | Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JournalDeclutter-${{ github.sha }}
          path: journal-declutter/build/release/package
          if-no-files-found: error

      - name: Zip for release
        if: startsWith(github.ref, 'refs/tags/journal-declutter-v')
        working-directory: journal-declutter
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^journal-declutter-v', ''
          Compress-Archive -Path build/release/package/* -DestinationPath "JournalDeclutter-$ver.zip"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/journal-declutter-v')
        uses: softprops/action-gh-release@v2
        with:
          files: journal-declutter/JournalDeclutter-*.zip
          generate_release_notes: true
